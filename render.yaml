services:
  - type: web
    name: cora-ai-synthetic-demo
    runtime: python
    plan: starter
    region: ohio
    rootDir: projects/cora-ai/implementation/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: cora-ai-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CORA_DB_PATH
        value: /var/data/cora_demo.sqlite3
